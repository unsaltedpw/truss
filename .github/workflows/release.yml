# Publish a truss release: the static binaries, their checksums, and a runnable
# image per supported OpenTofu version.
#
# ⚠️ THIS EXISTS BECAUSE HAND-BUILT IMAGES BROKE A CONSUMER. The applier's
# image used to be built with podman on the single box that runs it, which
# made it the one thing in the system not delivered by merging: a config
# change could outrun its runtime, and only an SSH session could close the
# gap. On 2026-09-08 that took an applier down for hours, and the fix could
# not be shipped BY the applier. Every failure mode of that path -- wrong
# machine, wrong image name, podman absent, an amd64-only download on an arm64
# laptop -- is a failure mode this workflow does not have.
#
# ⚠️ ONE IMAGE PER OPENTOFU VERSION, AND THE VERSION IS IN THE TAG. A
# consumer's CI plans with one tofu version and its applier re-plans with the
# one in this image; if they differ, every plan digest mismatches and every
# apply is refused. Putting the version in the tag makes that pin explicit
# rather than a coincidence. Supported versions are listed in `tofu-versions`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # The following permissions are required by actions/attest-build-provenance to
  # generate OIDC tokens and create attestations. id-token is used to mint
  # Sigstore certificates; attestations to store the signed attestation; and
  # artifact-metadata to record the artifact storage relationship.
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # leakscan reads `git log` for Co-Authored-By trailers, which a
          # depth-1 checkout cannot see past the tip commit.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # ⚠️ tofu IS A TEST DEPENDENCY HERE FOR THE SAME REASON IT IS IN ci.yml,
      # AND THIS WORKFLOW DID NOT INSTALL IT. internal/plan's declaration tests
      # generate real plan JSON and read it back; they FAIL rather than skip
      # when tofu is absent, deliberately. #12 installed it in ci.yml and not
      # here, so every release since has been broken and nothing noticed,
      # because nothing was tagged in between. v0.1.4 found it:
      #
      #     --- FAIL: TestDeclarationsFindsARootProvisioner
      #         tofu is required for TestDeclarations* and was not found on PATH
      #
      # ⚠️ THE SAME TWO LINES AS ci.yml, WHICH IS THE PROBLEM RATHER THAN THE
      # FIX. Two workflows now state one fact, and the next dependency added to
      # one will be missing from the other in exactly this way. Both should run
      # scripts/check instead; that is a larger change than a broken release
      # should carry, and it is recorded in docs/work-items.md.
      - run: |
          scripts/toolchain install tofu
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: tofu version

      # ⚠️ THE TAG IS TESTED AGAIN, NOT TRUSTED BECAUSE main WAS GREEN. A tag
      # can point at any commit, including one that never sat on main and
      # never passed ci.yml. A release is the artefact people run.
      - run: go vet ./...
      - run: go test -count=1 ./...

      # ⚠️ THE SCANNER'S OWN TEST RUNS FIRST, AND IT WAS MISSING HERE. ci.yml
      # has run both in this order since the scanner was written, on the
      # reasoning that a leak scan which has quietly stopped matching reports
      # success -- two of its patterns were once inert under a real grep while
      # passing green. This job ran the scan without the test, so a release
      # could be cut past a guard that had stopped guarding, and the comment
      # above is exactly why that matters: the tag is not trusted because main
      # was green.
      - run: scripts/leakscan-test
      - run: scripts/leakscan

      # And the dashboards and alerting rules, for the same reason as
      # everything else in this block: a tag can point at a commit that never
      # sat on main and never passed ci.yml, and observability/ is part of
      # what a release hands somebody.
      - uses: ./.github/actions/query-tools
      - run: scripts/check-observability
        env:
          TRUSS_REQUIRE_PROMTOOL: "1"

      # ⚠️ -trimpath AND NO BUILD STAMP, SO THE CHECKSUM MEANS SOMETHING. A
      # binary carrying a build path or a timestamp differs on every machine,
      # which makes a published sha256 an assertion nobody can check.
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -o "dist/truss-linux-$arch" ./cmd/truss
          done

      # ⚠️ A CHECK THAT CAN FAIL, rather than a claim in a comment. If a future
      # change embeds a path or a timestamp this goes red at release time,
      # instead of quietly making every published checksum unverifiable.
      - name: Prove the build is reproducible
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -o "recheck-$arch" ./cmd/truss
            cmp "dist/truss-linux-$arch" "recheck-$arch" \
              || { echo "build is not reproducible for $arch -- a published checksum would be unverifiable" >&2; exit 1; }
            rm -f "recheck-$arch"
          done

      - name: Checksums
        run: (cd dist && sha256sum truss-linux-amd64 truss-linux-arm64 > SHA256SUMS)

      # Attest the binaries: prove THIS CI produced them. Pinning by digest in
      # a reviewed diff proves the diff names a digest; it does not prove where
      # that digest came from. A consumer verifies with
      # `gh attestation verify <binary> --repo <owner>/<repo>`.
      #
      # ⚠️ THIS STEP FAILS ON A PRIVATE REPOSITORY UNLESS THE ACCOUNT IS ON
      # ENTERPRISE CLOUD. The action's own README: attestations are available
      # in public repositories on all current plans, and "to use artifact
      # attestations in private or internal repositories, you must be on a
      # GitHub Enterprise Cloud plan". This repository is intended to be public
      # and is not yet, so the first release cut while it is still private will
      # go red here -- the same shape as the branch-protection-costs-money note
      # in docs/threat-model.md, and worth knowing before the release rather
      # than during it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/truss-linux-amd64, dist/truss-linux-arm64

      # ⚠️ amd64 ONLY, DELIBERATELY, AND THE arm64 BINARY IS STILL PUBLISHED.
      # A multi-arch image needs QEMU on the runner, which means third-party
      # actions this repository has otherwise avoided (see `gh` below, used in
      # place of a release action). No consumer runs an arm64 cluster today.
      # Adding it later is a --platform list here plus binfmt; the Dockerfile
      # already reads TARGETARCH and needs no change.
      - name: Build and push images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          > dist/IMAGE_DIGESTS.txt
          while read -r tofu; do
            [ -n "$tofu" ] || continue
            tag="${IMAGE}:${GITHUB_REF_NAME}-tofu${tofu}"
            echo "::group::$tag"
            docker build --build-arg "OPENTOFU_VERSION=${tofu}" --build-arg TARGETARCH=amd64 -t "$tag" .
            docker push "$tag"
            # The digest is what a consumer pins; printing it here means it can
            # be read off the release without a registry round-trip.
            docker inspect --format '{{index .RepoDigests 0}}' "$tag" | tee -a dist/IMAGE_DIGESTS
            # ⚠️ BARE HEX BEFORE THE FIRST SPACE, NOT "sha256:...". The attest
            # action splits each line at the first space, takes everything to
            # its left as the digest, and validates it against a hex-only
            # regex -- `sha256:abc...` throws "Invalid digest" (verified in
            # actions/attest src/subject.ts, getSubjectFromChecksumsString).
            # docker inspect gives "image:tag@sha256:<hex>", so both halves are
            # cut out of that one string.
            ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")
            printf '%s %s\n' "${ref##*@sha256:}" "${ref%@*}" >> dist/IMAGE_DIGESTS.txt
            echo "::endgroup::"
          done < tofu-versions

      # Attest all built images: prove they came from this CI. The action reads
      # a checksums file where each line is "sha256:... image:tag". A consumer
      # verifies each image with: gh attestation verify --repo <owner>/<repo>
      # <image>@sha256:...
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/IMAGE_DIGESTS.txt

      # `gh` rather than a third-party release action: it ships on the runner,
      # and publishing a file should not add a supply-chain dependency.
      # ⚠️ THE RELEASE MAY ALREADY EXIST, AND THAT IS NOT A FAILURE. Creating a
      # release in the web UI is what CREATES the tag, so the ordinary way a
      # human cuts a release makes `gh release create` fail with "a release
      # with the same tag name already exists" -- after the image has already
      # been built and pushed. Measured on v0.1.0: everything succeeded and the
      # run went red on the last step, which reads as "the release failed" and
      # is the opposite of what happened.
      #
      # Upload with --clobber so re-running a release is idempotent too: the
      # assets are rebuilt from the same tag and reproduce byte-for-byte, so
      # replacing them cannot change what anyone already downloaded.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            dist/truss-linux-amd64 dist/truss-linux-arm64 dist/SHA256SUMS dist/IMAGE_DIGESTS LICENSE
